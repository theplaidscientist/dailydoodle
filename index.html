<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Doodle - Ideas for your Noodle!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  :root {
    --surface-0: #edeff2;
    --surface-1: #f1efe8;
    --surface-2: #ffffff;
    --text-primary: #2c2c2a;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
    --border: #b8b6ac;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--surface-0);
    color: var(--text-primary);
    max-width: 760px;
    margin: 0 auto;
    padding: 2rem 1rem;
  }
  h1 { font-family: 'Anton', sans-serif; font-size: 32px; font-weight: 400; letter-spacing: 0.02em; margin: 0; text-align: center; }
  .subtitle { font-size: 15px; color: var(--text-secondary); margin: 2px 0 0; text-align: center; }
  .instruction { text-align: center; font-size: 13px; color: var(--text-secondary); margin: 0 0 1rem; }
  #columns {
    columns: 210px 3;
    column-gap: 12px;
    margin-bottom: 1.5rem;
  }
  .col-card {
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 0.875rem;
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    margin-bottom: 12px;
  }
  .col-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .col-label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); }
  .col-actions { display: flex; align-items: center; gap: 2px; }
  .icon-btn {
    border: none; background: none; cursor: pointer; font-size: 13px;
    padding: 2px 5px; color: var(--text-muted); border-radius: 6px; line-height: 1;
  }
  .icon-btn:hover { background: var(--surface-1); }
  .item-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    padding: 4px 8px;
    background: var(--surface-1);
    border-radius: var(--radius);
  }
  .item-row button { border: none; background: none; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 0 4px; }
  .add-row { display: flex; gap: 6px; min-width: 0; }
  .add-row input {
    flex: 1; min-width: 0; font-size: 13px; height: 32px; padding: 0 8px;
    border: 0.5px solid var(--border); border-radius: var(--radius);
    background: var(--surface-2); color: var(--text-primary);
  }
  .add-row button, #spin-btn {
    border: 0.5px solid var(--border); background: var(--surface-2);
    border-radius: var(--radius); cursor: pointer; color: var(--text-primary);
  }
  .add-row button { padding: 0 10px; flex-shrink: 0; }
  .col-card { overflow: hidden; }
  .spin-wrap { display: flex; justify-content: center; margin-bottom: 1.5rem; }
  #spin-btn { font-size: 15px; font-weight: 500; padding: 10px 24px; }
  #spin-btn:hover, .add-row button:hover { background: var(--surface-1); }
  #result-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
    perspective: 600px;
    margin-bottom: 1rem;
  }
  .result-card {
    border-radius: 12px; padding: 0.875rem 0.5rem; text-align: center;
    font-weight: 500; font-size: 14px; min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s linear; border: 0.5px solid var(--border);
  }
  .card-teal   { background: #D7F3EA; color: #05513F; }
  .card-blue   { background: #DCEBFF; color: #1B4B91; }
  .card-purple { background: #E9E7FE; color: #3D3494; }
  .card-amber  { background: #FDF0D5; color: #7A5205; }
  .card-green  { background: #DFF2E1; color: #1E5631; }
  .card-navy   { background: #E1E4FB; color: #242B5C; }
  .card-cyan   { background: #D6F3F7; color: #0B5C66; }
  .card-gold   { background: #FFF3C4; color: #6B5900; }
  .card-tan    { background: #F0E4D2; color: #6B4A22; }
  #fill-blank { text-align: center; font-size: 16px; min-height: 24px; margin: 0 0 2rem; }
  footer { text-align: center; font-size: 12px; color: var(--text-muted); margin-bottom: 0.75rem; }
  footer em { font-style: italic; }

  .counter-wrap { display: flex; justify-content: center; margin: 0.75rem 0; }
  .counter-box {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--surface-2); border: 0.5px solid var(--border);
    border-radius: 999px; padding: 8px 18px;
  }
  .counter-label {
    font-size: 11px; font-weight: 500; color: var(--text-secondary);
    letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.2; text-align: left;
  }
  .counter-digits {
    font-family: 'Courier New', monospace; font-size: 17px; font-weight: 700;
    color: #242B5C; background: var(--surface-1); padding: 3px 9px;
    border-radius: 6px; letter-spacing: 1px;
  }

  .toggle-switch { position: relative; display: inline-block; width: 32px; height: 18px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: relative; z-index: 2; }
  .toggle-switch .track { position: absolute; inset: 0; background: var(--border); border-radius: 999px; transition: background .15s; pointer-events: none; }
  .toggle-switch .thumb { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: transform .15s; pointer-events: none; }
  .toggle-switch input:checked ~ .track { background: var(--text-primary); }
  .toggle-switch input:checked ~ .thumb { transform: translateX(14px); }
  .cat-card.inactive { padding-bottom: 0.6rem; }
  .cat-card.inactive .col-header { margin-bottom: 0; }
  .cat-card.inactive .item-list, .cat-card.inactive .add-row { display: none; }

  .mode-toggle { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
  .mode-btn {
    border: 0.5px solid var(--border); background: var(--surface-2);
    border-radius: 999px; padding: 6px 16px; font-size: 13px;
    cursor: pointer; color: var(--text-secondary);
  }
  .mode-btn.active { background: var(--text-primary); color: #fff; border-color: var(--text-primary); }

  .settings-row {
    display: flex; justify-content: center; align-items: center;
    gap: 14px; flex-wrap: wrap; margin-bottom: 1.25rem;
  }
  .repeat-toggle {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-secondary); cursor: pointer;
  }
  .repeat-toggle input { cursor: pointer; }
  .sound-btn {
    border: 0.5px solid var(--border); background: var(--surface-2);
    border-radius: 999px; padding: 5px 12px; font-size: 12px;
    cursor: pointer; color: var(--text-secondary);
  }
  .sound-btn.muted { opacity: 0.55; }

  .share-wrap { display: none; justify-content: center; align-items: center; gap: 10px; margin: -1rem 0 1.5rem; }
  #copy-btn {
    border: 0.5px solid var(--border); background: var(--surface-2);
    border-radius: var(--radius); padding: 7px 16px; font-size: 13px;
    cursor: pointer; color: var(--text-primary);
  }
  #copy-btn:hover { background: var(--surface-1); }
  #copy-feedback { font-size: 12px; color: var(--text-secondary); }

  .history-wrap { display: none; max-width: 420px; margin: 0 auto 2rem; font-size: 13px; color: var(--text-secondary); }
  .history-wrap summary { cursor: pointer; text-align: center; font-weight: 500; padding: 4px 0; }
  #history-list { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  #history-list li { background: var(--surface-2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 6px 10px; }

  @media (max-width: 480px) {
    body { padding: 1.5rem 0.75rem; }
    h1 { font-size: 20px; }
    .subtitle, .instruction { font-size: 13px; }
    #columns { columns: 150px 2; column-gap: 8px; }
    .col-card { padding: 0.75rem; }
    #result-row { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
    .result-card { font-size: 13px; padding: 0.75rem 0.4rem; }
    #fill-blank { font-size: 15px; }
  }
</style>
</head>
<body>

<h1>Daily Doodle</h1>
<p class="subtitle">Ideas for your Noodle!</p>

<div class="counter-wrap">
  <div class="counter-box">
    <span class="counter-label">DOODLE IDEAS<br>GENERATED</span>
    <span class="counter-digits" id="hit-counter">------</span>
  </div>
</div>

<p class="instruction">Add your own items, then hit spin.</p>

<div class="mode-toggle">
  <button class="mode-btn active" data-mode="beginner">Beginner</button>
  <button class="mode-btn" data-mode="advanced">Advanced</button>
</div>

<div class="settings-row">
  <label class="repeat-toggle">
    <input type="checkbox" id="avoid-repeats"> Avoid repeats until all shown
  </label>
  <button id="sound-toggle" class="sound-btn" aria-pressed="true" aria-label="Toggle sound effects">🔊 Sound</button>
</div>

<div id="columns"></div>

<div class="spin-wrap">
  <button id="spin-btn">Spin</button>
</div>

<div id="result-row"></div>

<p id="fill-blank"></p>

<div class="share-wrap" id="share-wrap">
  <button id="copy-btn">Copy result</button>
  <span id="copy-feedback"></span>
</div>

<details class="history-wrap" id="history-wrap">
  <summary>Recent doodles</summary>
  <ul id="history-list"></ul>
</details>

<footer><em>Brought to you by the Plaid Scientist from Plaid Labs</em> v 1.2</footer>

<script>
const categories = {
  animal:  { label: "Animal",     icon: "🐾", color: "card-teal",   items: ["Octopus","Raccoon","Owl","Fox","Turtle","Penguin"], active: true },
  job:     { label: "Occupation", icon: "💼", color: "card-blue",   items: ["Detective","Chef","Astronaut","Librarian","Pirate","DJ"], active: true },
  prop:    { label: "Prop",       icon: "🎁", color: "card-purple", items: ["Umbrella","Teacup","Boombox","Skateboard","Lantern","Camera"], active: true },
  vehicle: { label: "Vehicle",    icon: "🚗", color: "card-amber",  items: ["Spaceship","Car","Zeppelin","Scooter","Bike","Boat"], active: true },
  style:   { label: "Style",      icon: "🎨", color: "card-green",  items: ["Anime","Disney-style","Looney Tunes","Chibi","Comic Book","Retro 90s Cartoon"], active: true },
  medium:  { label: "Medium",     icon: "✏️", color: "card-navy",   items: ["Pencil","Digital","Ink","Color","Sketch","Watercolor"], active: true },
  outfit:  { label: "Outfit",     icon: "👕", color: "card-tan",    items: ["Hoodie","Sweater","T-Shirt","Superhero Spandex","Pajamas","Tuxedo"], active: true },
  mood:    { label: "Mood",       icon: "😊", color: "card-gold",   items: ["Happy","Sad","Angry","Sleepy","Surprised","Nervous"], active: true },
  setting: { label: "Setting",    icon: "🏞️", color: "card-cyan",   items: ["Woods","Space","Inside","Beach","Castle","City Street"], active: true }
};
const keys = Object.keys(categories);
const DEFAULT_ITEMS = {};
keys.forEach(k => { DEFAULT_ITEMS[k] = [...categories[k].items]; });
const CORE_KEYS = ['animal', 'job', 'prop'];
let mode = 'beginner';
let avoidRepeats = false;
let history = [];
let currentCount = null;
let currentPlainResult = '';
let soundEnabled = true;

function renderColumns() {
  const wrap = document.getElementById('columns');
  const displayKeys = mode === 'beginner' ? CORE_KEYS : keys;
  wrap.innerHTML = displayKeys.map(key => {
    const cat = categories[key];
    const isActive = mode === 'beginner' ? true : cat.active;
    const showToggle = mode === 'advanced';
    return `
    <div class="col-card cat-card ${isActive ? '' : 'inactive'}" id="card-wrap-${key}">
      <div class="col-header">
        <div class="col-label"><span>${cat.icon}</span>${cat.label}</div>
        <div class="col-actions">
          <button id="clear-${key}" class="icon-btn" title="Clear all items" aria-label="Clear ${cat.label} items">🗑</button>
          <button id="restore-${key}" class="icon-btn" title="Restore suggested items" aria-label="Restore ${cat.label} suggestions">↺</button>
          ${showToggle ? `
          <label class="toggle-switch">
            <input type="checkbox" data-key="${key}" ${cat.active ? 'checked' : ''} aria-label="Include ${cat.label}">
            <span class="track"></span>
            <span class="thumb"></span>
          </label>` : ''}
        </div>
      </div>
      <div id="list-${key}" class="item-list"></div>
      <div class="add-row">
        <input type="text" id="input-${key}" placeholder="Add ${cat.label.toLowerCase()}" />
        <button id="add-${key}">+</button>
      </div>
    </div>`;
  }).join('');

  displayKeys.forEach(key => {
    renderItems(key);
    document.getElementById('add-' + key).onclick = () => addItem(key);
    document.getElementById('input-' + key).addEventListener('keydown', e => { if (e.key === 'Enter') addItem(key); });
    document.getElementById('clear-' + key).onclick = () => clearCategory(key);
    document.getElementById('restore-' + key).onclick = () => restoreCategory(key);
    const toggleInput = wrap.querySelector(`input[data-key="${key}"]`);
    if (toggleInput) {
      toggleInput.addEventListener('change', e => {
        categories[key].active = e.target.checked;
        document.getElementById('card-wrap-' + key).classList.toggle('inactive', !categories[key].active);
        renderResultRow();
        fillBlank.textContent = '';
        hideShare();
      });
    }
  });
}

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    mode = btn.getAttribute('data-mode');
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b === btn));
    renderColumns();
    renderResultRow();
    fillBlank.textContent = '';
    hideShare();
  });
});

document.getElementById('avoid-repeats').addEventListener('change', e => {
  avoidRepeats = e.target.checked;
});

function renderItems(key) {
  const list = document.getElementById('list-' + key);
  list.innerHTML = categories[key].items.map((item, i) => `
    <div class="item-row">
      <span>${item}</span>
      <button data-key="${key}" data-idx="${i}" class="rm-btn" aria-label="Remove ${item}">x</button>
    </div>
  `).join('');
  list.querySelectorAll('.rm-btn').forEach(btn => {
    btn.onclick = () => {
      const k = btn.getAttribute('data-key');
      const idx = parseInt(btn.getAttribute('data-idx'));
      categories[k].items.splice(idx, 1);
      renderItems(k);
    };
  });
}

function addItem(key) {
  const input = document.getElementById('input-' + key);
  const val = input.value.trim();
  if (!val) return;
  categories[key].items.push(val);
  input.value = '';
  renderItems(key);
}

function clearCategory(key) {
  categories[key].items = [];
  categories[key].remaining = null;
  renderItems(key);
}

function restoreCategory(key) {
  categories[key].items = [...DEFAULT_ITEMS[key]];
  categories[key].remaining = null;
  renderItems(key);
}

function activeKeys() {
  if (mode === 'beginner') return CORE_KEYS;
  return keys.filter(k => categories[k].active);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getFinalPick(key) {
  if (!avoidRepeats) {
    return categories[key].items[Math.floor(Math.random() * categories[key].items.length)];
  }
  if (!categories[key].remaining || categories[key].remaining.length === 0) {
    categories[key].remaining = shuffle(categories[key].items);
  }
  return categories[key].remaining.pop();
}

const resultRow = document.getElementById('result-row');
function renderResultRow() {
  const active = activeKeys();
  resultRow.innerHTML = active.map(k => `
    <div class="result-card ${categories[k].color}" id="card-${k}">
      <span id="text-${k}">?</span>
    </div>
  `).join('');
}

const fillBlank = document.getElementById('fill-blank');

function buildSentence(active, result, htmlMode) {
  if (active.length === 0) return '';
  const wrap = s => htmlMode ? `<strong>${s}</strong>` : s;
  const lead = [];
  if (active.includes('medium')) lead.push(wrap(result.medium));
  if (active.includes('style')) lead.push(wrap(result.style) + '-style');
  const leadStr = lead.length ? lead.join(' ') + ' drawing of ' : '';

  const subject = [];
  if (active.includes('job')) subject.push(wrap(result.job));
  if (active.includes('animal')) subject.push(wrap(result.animal));
  const subjectStr = subject.length ? subject.join(' ') : 'doodle';

  const extras = [];
  if (active.includes('outfit')) extras.push(`wearing a ${wrap(result.outfit)}`);
  if (active.includes('prop')) extras.push(`with a ${wrap(result.prop)}`);
  if (active.includes('vehicle')) extras.push(`riding a ${wrap(result.vehicle)}`);
  if (active.includes('mood')) extras.push(`looking ${wrap(result.mood)}`);
  if (active.includes('setting')) extras.push(`in the ${wrap(result.setting)}`);

  let sentence = `Your daily doodle idea is a ${leadStr}${subjectStr}`;
  if (extras.length) sentence += ' ' + extras.join(', ');
  sentence += '.';
  return sentence;
}

document.getElementById('spin-btn').onclick = () => {
  const active = activeKeys();
  if (active.length === 0) {
    fillBlank.textContent = '';
    resultRow.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); font-size:14px;">Turn on at least one category to spin</div>`;
    return;
  }
  const emptyCat = active.find(k => categories[k].items.length === 0);
  if (emptyCat) {
    fillBlank.textContent = '';
    resultRow.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); font-size:14px;">Add at least one item to ${categories[emptyCat].label}</div>`;
    return;
  }
  renderResultRow();
  fillBlank.textContent = '';
  incrementCounter();
  const boopInterval = setInterval(playBoop, 110);
  const finished = {};
  let completed = 0;
  active.forEach((k, i) => {
    const card = document.getElementById('card-' + k);
    const text = document.getElementById('text-' + k);
    let ticks = 0;
    const totalTicks = 12;
    function tick() {
      const isFinal = ticks === totalTicks - 1;
      const pick = isFinal ? getFinalPick(k) : categories[k].items[Math.floor(Math.random() * categories[k].items.length)];
      text.textContent = pick;
      card.style.transform = ticks % 2 === 0 ? 'rotateX(90deg)' : 'rotateX(0deg)';
      ticks++;
      if (ticks < totalTicks) {
        const progress = ticks / totalTicks;
        const delay = 70 + progress * progress * 160;
        setTimeout(tick, delay);
      } else {
        card.style.transform = 'rotateX(0deg)';
        finished[k] = pick;
        completed++;
        if (completed === active.length) {
          fillBlank.innerHTML = buildSentence(active, finished, true);
          clearInterval(boopInterval);
          playTada();
          const plainText = buildSentence(active, finished, false);
          showShare(plainText);
          addToHistory(plainText);
        }
      }
    }
    setTimeout(tick, i * 200);
  });
};

renderColumns();
renderResultRow();

// --- Share / copy result ---
function showShare(text) {
  currentPlainResult = text;
  document.getElementById('share-wrap').style.display = 'flex';
  document.getElementById('copy-feedback').textContent = '';
}
function hideShare() {
  document.getElementById('share-wrap').style.display = 'none';
}
document.getElementById('copy-btn').addEventListener('click', () => {
  let shareText = currentPlainResult;
  if (currentCount != null) shareText += ` (Daily Doodle #${currentCount})`;
  shareText += ' — https://theplaidscientist.github.io/dailydoodle/';
  navigator.clipboard.writeText(shareText).then(() => {
    const fb = document.getElementById('copy-feedback');
    fb.textContent = 'Copied!';
    setTimeout(() => { fb.textContent = ''; }, 2000);
  }).catch(() => {
    document.getElementById('copy-feedback').textContent = 'Could not copy';
  });
});

// --- Recent doodle history (last 3) ---
function addToHistory(text) {
  history.unshift(text);
  history = history.slice(0, 3);
  renderHistory();
}
function renderHistory() {
  const wrap = document.getElementById('history-wrap');
  const list = document.getElementById('history-list');
  if (history.length === 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  list.innerHTML = history.map(h => `<li>${h}</li>`).join('');
}

// --- Retro sound effects (synthesized, no audio files needed) ---
function getAudioCtx() {
  if (!window._doodleAudioCtx) {
    window._doodleAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  const ctx = window._doodleAudioCtx;
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}

function playBoop() {
  if (!soundEnabled) return;
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'square';
  osc.frequency.value = 520;
  gain.gain.setValueAtTime(0.12, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.08);
}

function playTada() {
  if (!soundEnabled) return;
  const ctx = getAudioCtx();
  const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
  notes.forEach((freq, i) => {
    const start = ctx.currentTime + i * 0.09;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.18, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.35);
    osc.connect(gain).connect(ctx.destination);
    osc.start(start);
    osc.stop(start + 0.4);
  });
}

document.getElementById('sound-toggle').addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('sound-toggle');
  btn.textContent = soundEnabled ? '🔊 Sound' : '🔇 Sound';
  btn.setAttribute('aria-pressed', String(soundEnabled));
  btn.classList.toggle('muted', !soundEnabled);
});

// --- Old-school hit counter (Firebase Realtime Database) ---
const DB_URL = 'https://daily-doodle-b7c57-default-rtdb.firebaseio.com';
const COUNTER_PATH = '/counters/dailyDoodle.json';
const counterEl = document.getElementById('hit-counter');

function formatCount(n) {
  return String(n).padStart(6, '0');
}

fetch(`${DB_URL}${COUNTER_PATH}`)
  .then(r => r.json())
  .then(value => { currentCount = value || 0; counterEl.textContent = formatCount(currentCount); })
  .catch(err => { console.error('Doodle counter fetch failed:', err); counterEl.textContent = '------'; });

function incrementCounter() {
  fetch(`${DB_URL}${COUNTER_PATH}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ '.sv': { 'increment': 1 } })
  })
    .then(r => r.json())
    .then(value => { currentCount = value; counterEl.textContent = formatCount(value); })
    .catch(err => { console.error('Doodle counter increment failed:', err); });
}

</script>
